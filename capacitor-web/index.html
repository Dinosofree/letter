<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>信件档案</title>
  <style>
    body {
      margin: 0;
      background: #FAF7F2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .loader {
      width: 24px;
      height: 24px;
      border: 2px solid #E0D7C6;
      border-top-color: #8B7355;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="loader"></div>
  <script>
    window.location.href = 'https://letter-archive.vercel.app';
  </script>
</body>
</html>
