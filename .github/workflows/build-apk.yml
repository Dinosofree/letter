name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Your deployed app URL (e.g. https://letter-archive.vercel.app)"
        required: true
        default: "https://letter-archive.vercel.app"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize TWA project
        run: |
          APP_URL="${{ github.event.inputs.app_url }}"
          bubblewrap init --manifest="$APP_URL/manifest.webmanifest" --directory=./twa

      - name: Copy custom icons
        run: |
          cp android/app/src/main/res/drawable/ic_foreground.png twa/app/src/main/res/drawable/ 2>/dev/null || true
          cp android/app/src/main/res/drawable/ic_background.png twa/app/src/main/res/drawable/ 2>/dev/null || true

      - name: Build APK
        run: |
          cd twa
          bubblewrap build
          ls app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: letter-archive-apk
          path: twa/app/build/outputs/apk/release/*.apk
          retention-days: 90
